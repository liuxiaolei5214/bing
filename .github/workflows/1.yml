# .github/workflows/import-year.yml
name: Import Year Files (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull year/month from source repo
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/liuxiaolei5214/bing-wallpaper.git /tmp/src || \
          git clone --depth 1 https://github.com/liuxiaolei5214/bing-wallpaper.git /tmp/src

          mkdir -p docs/json
          if [ -d /tmp/src/docs/json/year ]; then
            cp -rv /tmp/src/docs/json/year docs/json/
          fi
          if [ -d /tmp/src/docs/json/month ]; then
            cp -rv /tmp/src/docs/json/month docs/json/
          fi

          echo "=== 导入后 ==="
          find docs/json/year -type f | head -20
          find docs/json/month -type f | head -20

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/json/year docs/json/month
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "import year/month files"
            git push
          fi
