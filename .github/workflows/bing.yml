name: Bing Wallpaper

on:
  schedule:
    # 每天 UTC 23:00（北京时间 07:00）
    - cron: '0 23 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run script
        run: node scripts/bing_wallpaper.js

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/json/
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "auto update bing wallpaper $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi
