name: Bing Wallpaper

on:
  #schedule:
    # UTC 16:00 = 北京时间 00:00
   # - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run script
        run: node scripts/bing_wallpaper.js

      - name: Touch index.html to refresh cache
        run: |
          mkdir -p docs
          touch docs/index.html
          export TZ='Asia/Shanghai'
          echo "✅ 缓存已刷新 (北京时间)  $(date '+%Y-%m-%d %H:%M:%S')" >> docs/cache.log

      - name: Send WeChat notification
        env:
          TITLE: ${{ env.TITLE }}
          SUBTITLE: ${{ env.SUBTITLE }}
          DATE: ${{ env.DATE }}
          BING_URL: ${{ env.BING_URL }}
          DESC_LEN: ${{ env.DESC_LEN }}
          HISTORY_COUNT: ${{ env.HISTORY_COUNT }}
        run: |
          node -e '
          const https = require("https");
          const webhook = "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=fbc3ee80-bc01-439f-965b-6e8806e39351";
          const images = [
            "https://image.lei5214.cc.cd/img/2026/03/1.jpg","https://image.lei5214.cc.cd/img/2026/03/2.jpg",
            "https://image.lei5214.cc.cd/img/2026/03/3.jpg","https://image.lei5214.cc.cd/img/2026/03/4.jpg",
            "https://image.lei5214.cc.cd/img/2026/03/5.jpg","https://image.lei5214.cc.cd/img/2026/03/6.jpg",
            "https://image.lei5214.cc.cd/img/2026/03/7.jpg","https://image.lei5214.cc.cd/img/2026/03/8.jpg",
            "https://image.lei5214.cc.cd/img/2026/03/9.jpg","https://image.lei5214.cc.cd/img/2026/03/10.jpg",
            "https://image.lei5214.cc.cd/img/2026/03/11.jpg","https://image.lei5214.cc.cd/img/2026/03/12.jpg",
            "https://image.lei5214.cc.cd/img/2026/03/13.jpg","https://image.lei5214.cc.cd/img/2026/03/14.jpg",
            "https://image.lei5214.cc.cd/img/2026/03/15.jpg","https://image.lei5214.cc.cd/img/2026/03/16.jpg"
          ];
          const pick = images[Math.floor(Math.random() * images.length)];
          const title = "🎉 Bing壁纸 · " + (process.env.DATE || "");
          const desc ="历史归档：" + (process.env.HISTORY_COUNT || 0) + " 张" + 
                      "\n历史描述：" + (process.env.DESC_LEN || 0) + " 字符" +
                      "\n当前副标：" + (process.env.TITLE || "") + 
                      "\n当前主标：" + (process.env.SUBTITLE || "");
          const payload = JSON.stringify({
            msgtype: "news",
            news: { articles: [{
              title: title,
              description: desc,
              url: "https://bingapi.lxl5214.dpdns.org/",
              picurl: pick
            }] }
          });
          const u = new URL(webhook);
          const req = https.request({
            hostname: u.hostname,
            path: u.pathname + u.search,
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Content-Length": Buffer.byteLength(payload)
            }
          }, res => {
            res.on("data", () => {});
            res.on("end", () => console.log("📱 通知发送完成, status=" + res.statusCode));
          });
          req.on("error", e => console.error("通知异常:", e.message));
          req.write(payload);
          req.end();
          '
          
      - name: Commit & Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/

          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "auto update $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
