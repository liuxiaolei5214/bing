<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bing 每日壁纸 · 精彩轮播</title>
    <meta name="description" content="每日更新的必应超清壁纸，4K 高清下载 · 光影回顾" />
    <link rel="icon" href="/favicon.avif">
    <style>
        /* ===== 基础重置 & 隐藏滚动条 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            scrollbar-width: none;
            -ms-overflow-style: none;
            background: #0e1218;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        .fullscreen-section {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 0;
        }

        /* ===== 顶部悬浮胶囊毛玻璃导航 ===== */
        .top-nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            background: rgba(40, 40, 40, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .top-nav .nav-item {
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            transition: all 0.25s ease;
            white-space: nowrap;
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: inherit;
        }

        .top-nav .nav-item:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .top-nav .nav-item.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.18);
            font-weight: 500;
        }

        /* ===== 轮播主区域 ===== */
        #movieCarouselSection {
            background: #0e1218;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        .carousel-movie {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #14191f;
        }

        /* 
         * ===== 层级清晰 =====
         * 图片最底层，然后统一遮罩，最后是文字/按钮/缩略图 
         */
        .movie-slide {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: background-image 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            align-items: flex-end;
            position: relative;
        }

        /* ===== 唯一的全局渐变遮罩：覆盖整个底部 ===== */
        .movie-global-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            z-index: 10; /* 在图片之上，内容之下 */
            background: linear-gradient(to top, 
                rgba(0, 0, 0, 0.9) 0%,   
                rgba(0, 0, 0, 0.5) 40%,
                rgba(0, 0, 0, 0.0) 100%
            );
            pointer-events: none; /* 让鼠标穿透，不影响底部区域点击 */
        }

        /* 底部内容容器：在遮罩之上 */
        .movie-bottom-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            width: 100%;
            pointer-events: none; /* 穿透，防止阻挡鼠标穿透 */
        }

        /* 标题行 + 按钮 */
        .movie-bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 40px 12px;
            gap: 20px;
            pointer-events: none;
        }

        .movie-title-bar {
            pointer-events: auto;
            flex-shrink: 1;
            min-width: 0;
        }

        .movie-title-bar .movie-info {
            color: #f0f0ea;
        }

        .movie-title-bar .movie-title {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 隐藏掉日期 */
        .movie-title-bar .movie-date {
            display: none;
        }

        /* 按钮组 */
        .movie-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            pointer-events: auto;
            flex-shrink: 0;
        }

        .movie-actions .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 0.8px;
            text-decoration: none;
            color: #f0ede8;
            background: transparent; 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            transition: all 0.25s;
            white-space: nowrap;
        }

        .movie-actions .btn svg {
            flex-shrink: 0;
            margin-right: 4px;
            width: 14px;
            height: 14px;
        }

        .btn-primary {
            border-color: rgba(240, 230, 200, 0.5);
            color: #f0e6d8;
        }
        .btn-primary:hover, .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        /* ===== 底部缩略图：无背景，直接悬浮于全局渐变之上 ===== */
        .movie-thumbnails {
            display: flex;
            align-items: center;
            width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
            background: transparent; /* 彻底移除遮罩 */
            border-top: none;        /* 彻底移除分割线 */
            padding: 10px 40px 12px; 
            gap: 8px;
            pointer-events: auto;    /* 恢复点击 */
        }
        .movie-thumbnails::-webkit-scrollbar {
            display: none;
        }

        .movie-thumbnails .thumb-item {
            flex: 1;
            min-width: 60px;
            height: 60px;
            border-radius: 4px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.25s;
            opacity: 0.7; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .movie-thumbnails .thumb-item.active {
            border-color: #e8e0d0;
            opacity: 1;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(200, 180, 140, 0.4);
        }

        .movie-thumbnails .thumb-item:hover {
            opacity: 1;
        }

        /* ===== 左右切换箭头 ===== */
        .movie-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(10, 14, 18, 0.3);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(200, 200, 200, 0.15);
            color: #e0ddd0;
            width: 3.4rem;
            height: 3.4rem;
            border-radius: 60px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            z-index: 30; /* 层级最高，在一切之上 */
            opacity: 0;
            visibility: hidden;
            padding: 0;
        }

        .movie-slide.show-nav .movie-btn {
            opacity: 0.7;
            visibility: visible;
        }

        .movie-btn:hover {
            background: rgba(30, 40, 48, 0.6);
            opacity: 1;
            transform: translateY(-50%) scale(1.05);
        }

        .movie-btn svg {
            width: 1.8rem;
            height: 1.8rem;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .movie-btn.prev { left: 1.2rem; }
        .movie-btn.next { right: 1.2rem; }

        /* ===== 加载状态 ===== */
        .loading {
            color: #888;
            font-size: 1rem;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
        }

        /* ===== 响应式 · 移动端 ===== */
        @media (max-width: 640px) {
            .top-nav {
                top: 12px;
                padding: 4px 8px;
                gap: 2px;
            }
            .top-nav .nav-item {
                padding: 5px 12px;
                font-size: 0.72rem;
            }

            .movie-bottom-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                padding: 0 20px 12px;
            }

            .movie-title-bar .movie-title {
                font-size: 1.1rem;
                white-space: normal;
            }

            .movie-actions {
                gap: 6px;
            }

            .movie-actions .btn {
                font-size: 0.6rem;
                padding: 4px 10px;
            }

            .movie-thumbnails {
                padding: 8px 20px 12px;
                gap: 6px;
            }

            .movie-thumbnails .thumb-item {
                min-width: 40px;
                height: 38px;
            }

            .movie-btn {
                width: 2.6rem;
                height: 2.6rem;
            }
            .movie-btn svg {
                width: 1.4rem;
                height: 1.4rem;
            }
            .movie-btn.prev { left: 0.4rem; }
            .movie-btn.next { right: 0.4rem; }
            
            .movie-global-overlay {
                height: 55%;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 顶部悬浮胶囊毛玻璃导航 ===== -->
    <nav class="top-nav">
        <a href="/" class="nav-item">首页</a>
        <a href="#" class="nav-item active">精彩轮播</a>
        <a href="/archive.html" class="nav-item">历史归档</a>
        <a href="/api.html" class="nav-item">API</a>
        <a href="/about.html" class="nav-item">关于</a>
    </nav>

    <!-- ===== 轮播页 - 全屏 ===== -->
    <section id="movieCarouselSection" class="fullscreen-section">
        <div class="carousel-movie">
            <div class="movie-slide active" id="movieSlide" style="background-image: url('');">
                <div class="loading" id="movieLoading">加载中...</div>
                
                <!-- 唯一的全局渐变遮罩 -->
                <div class="movie-global-overlay"></div>
                
                <!-- 内容区（层级高于遮罩） -->
                <div class="movie-bottom-container">
                    <!-- 标题行 + 按钮 -->
                    <div class="movie-bottom-bar">
                        <div class="movie-title-bar">
                            <div class="movie-info">
                                <div class="movie-title" id="movieTitle"></div>
                                <div class="movie-date" id="movieDate"></div>
                            </div>
                        </div>
                        <div class="movie-actions" id="movieActions">
                            <a href="#" class="btn btn-primary" id="movieDownloadBtn" target="_blank"></a>
                            <a href="#" class="btn btn-secondary" id="movieViewBtn" target="_blank"></a>
                            <a href="#" class="btn btn-secondary" id="movieDetailBtn" target="_blank"></a>
                        </div>
                    </div>
                    
                    <!-- 底部铺满的矩形缩略图 -->
                    <div class="movie-thumbnails" id="movieThumbnails"></div>
                </div>

                <!-- 左右控制 -->
                <button class="movie-btn prev" id="moviePrev">
                    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <button class="movie-btn next" id="movieNext">
                    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            </div>
        </div>
    </section>

    <script>
        (function() {
            "use strict";

            const ICONS = {
                download: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
                book: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
            };

            function isMobileDevice() {
                return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent) || window.innerWidth <= 640;
            }

            function get1080pUrl(url) {
                if (!url) return '';
                let result = url;
                if(isMobileDevice()){
                    result = result.replace(/_UHD\.jpg/g, '_1080x1920.jpg');
                    result = result.replace(/_1920x1080\.jpg/g, '_1080x1920.jpg');
                }else{
                    result = result.replace(/_UHD\.jpg/g, '_1920x1080.jpg');
                    result = result.replace(/_UHD\.jpg\?/g, '_1920x1080.jpg?');
                }
                result = result.replace(/&w=3840&h=2160&rs=1&c=4/g, '');
                return result;
            }

            function get4kUrl(url) {
                if (!url) return '';
                if (url.includes('_UHD.jpg')) {
                    return url;
                }
                if(isMobileDevice()){
                    return url.replace(/_1920x1080\.jpg/g, '_1080x1920.jpg');
                }else{
                    return url.replace(/_1920x1080\.jpg/g, '_UHD.jpg');
                }
            }

            function getDetailUrl(title, dateStr) {
                if (!dateStr) return '#';
                let cleanTitle = title.replace(/\s*[-–]\s*\d{4}\/\d{2}\/\d{2}$/, '').trim();
                const parts = dateStr.split('-');
                const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                d.setDate(d.getDate() - 1);
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const dateParam = `${y}${m}${day}_1600`;
                return `https://cn.bing.com/search?q=${encodeURIComponent(cleanTitle)}&form=hpcapt&filters=HpDate:%22${dateParam}%22+mgzv3configlist:%22BingQA_Encyclopedia_Layout%22`;
            }

            let wallpaperDataPromise = null;
        
            function fetchWallpaperData() {
                if (!wallpaperDataPromise) {
                    wallpaperDataPromise = fetch('json/bing_wallpaper.json')
                        .then(resp => {
                            if (!resp.ok) throw new Error('HTTP ' + resp.status);
                            return resp.json();
                        })
                        .catch(err => {
                            wallpaperDataPromise = null;
                            throw err;
                        });
                }
                return wallpaperDataPromise;
            }

            // ============================================================
            // ===== 轮播功能 =====
            // ============================================================
            let allData = [];
            let currentIndex = 0;
            let autoPlayTimer = null;
            const AUTOPLAY_INTERVAL = 6000;

            const slide = document.getElementById('movieSlide');
            const titleEl = document.getElementById('movieTitle');
            const dateEl = document.getElementById('movieDate');
            const downloadBtn = document.getElementById('movieDownloadBtn');
            const viewBtn = document.getElementById('movieViewBtn');
            const detailBtn = document.getElementById('movieDetailBtn');
            const thumbnails = document.getElementById('movieThumbnails');
            const prevBtn = document.getElementById('moviePrev');
            const nextBtn = document.getElementById('movieNext');
            const loadingEl = document.getElementById('movieLoading');

            async function loadCarousel() {
                try {
                    const data = await fetchWallpaperData();

                    if (!Array.isArray(data) || data.length === 0) {
                        throw new Error('数据为空或格式无效');
                    }

                    data.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

                    allData = data;
                    currentIndex = 0;
                    loadingEl.style.display = 'none';

                    thumbnails.innerHTML = '';
                    allData.forEach((item, idx) => {
                        const thumb = document.createElement('div');
                        thumb.className = 'thumb-item' + (idx === 0 ? ' active' : '');
                        const imgUrl = get1080pUrl(item.bing_url || item.url || '');
                        thumb.style.backgroundImage = `url('${imgUrl}')`;
                        thumb.title = item.title || '壁纸';
                        thumb.addEventListener('click', () => goToSlide(idx));
                        thumbnails.appendChild(thumb);
                    });

                    updateSlide(0);
                    resetAutoPlay();

                } catch (e) {
                    console.warn('轮播加载失败:', e);
                    loadingEl.textContent = '⚠️ 加载失败: ' + e.message;
                }
            }

            function updateSlide(index) {
                if (!allData || allData.length === 0) return;
                const item = allData[index];
                if (!item) return;

                const imgUrl = get1080pUrl(item.bing_url || item.url || '');
                const title = item.title || '壁纸';

                slide.style.backgroundImage = `url('${imgUrl}')`;
                titleEl.textContent = title;

                const hd4k = get4kUrl(item.bing_url || item.url || '');
                const hd1080 = get1080pUrl(item.bing_url || item.url || '');
                
                downloadBtn.innerHTML = `${ICONS.download} UHD/4K`;
                downloadBtn.href = hd4k;
                
                viewBtn.innerHTML = `${ICONS.download} 1080P`;
                viewBtn.href = hd1080;

                const detailUrl = getDetailUrl(item.title || item.subtitle || '', item.date);
                detailBtn.innerHTML = `${ICONS.book} 光影回顾`;
                detailBtn.href = detailUrl;

                document.querySelectorAll('.thumb-item').forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                    if (i === index) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }
                });

                prevBtn.style.visibility = index === 0 ? 'hidden' : 'visible';
                nextBtn.style.visibility = index >= allData.length - 1 ? 'hidden' : 'visible';
            }

            function nextSlide() {
                if (!allData || allData.length === 0) return;
                currentIndex = (currentIndex + 1) % allData.length;
                updateSlide(currentIndex);
            }

            function prevSlide() {
                if (!allData || allData.length === 0) return;
                currentIndex = (currentIndex - 1 + allData.length) % allData.length;
                updateSlide(currentIndex);
            }

            function goToSlide(index) {
                if (!allData || allData.length === 0) return;
                if (index < 0 || index >= allData.length) return;
                currentIndex = index;
                updateSlide(currentIndex);
                resetAutoPlay();
            }

            function resetAutoPlay() {
                if (autoPlayTimer) {
                    clearInterval(autoPlayTimer);
                    autoPlayTimer = null;
                }
                if (allData.length > 1) {
                    autoPlayTimer = setInterval(nextSlide, AUTOPLAY_INTERVAL);
                }
            }

            // 事件绑定
            slide.addEventListener("click", function(e){
                if(!e.target.closest(".movie-btn") && !e.target.closest(".thumb-item") && !e.target.closest(".movie-actions")){
                    slide.classList.toggle("show-nav");
                }
            });

            prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prevSlide(); resetAutoPlay(); });
            nextBtn.addEventListener('click', (e) => { e.stopPropagation(); nextSlide(); resetAutoPlay(); });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') { prevSlide(); resetAutoPlay(); e.preventDefault(); }
                if (e.key === 'ArrowRight') { nextSlide(); resetAutoPlay(); e.preventDefault(); }
            });

            let touchStartX = 0;
            slide.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            slide.addEventListener('touchend', (e) => {
                const diff = touchStartX - e.changedTouches[0].screenX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) { nextSlide(); resetAutoPlay(); } else { prevSlide(); resetAutoPlay(); }
                }
            }, { passive: true });

            // 启动
            loadCarousel();
        })();
    </script>
</body>
</html>
