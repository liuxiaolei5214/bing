<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bing Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            color: #fff;
            overflow: hidden;
        }
        section {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
        }
        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 极简微弱遮罩，保留原图质感 */
        .mask {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0.05) 100%);
        }
        .info-wrap {
            position: absolute;
            left: 48px;
            bottom: 48px;
            z-index: 2;
            max-width: 520px;
        }
        .title {
            font-size: 34px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .desc {
            font-size: 16px;
            font-weight: 300;
            opacity: 0.82;
            line-height: 1.6;
        }
        .meta {
            margin-top:14px;
            font-size:14px;
            opacity:0.7;
        }
        /* 苹果极简胶囊按钮 */
        .btn {
            margin-top:24px;
            display:inline-block;
            padding: 11px 24px;
            border-radius: 999px;
            background: rgba(255,255,255,0.16);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color:#fff;
            font-size:15px;
            font-weight:400;
            cursor:pointer;
            transition: background 0.24s ease, border-color 0.24s ease;
        }
        .btn:hover {
            background: rgba(255,255,255,0.24);
            border-color: rgba(255,255,255,0.35);
        }
        /* 轮播区域 */
        .carousel-wrap {
            position:absolute;
            bottom:36px;
            left:50%;
            transform:translateX(-50%);
            z-index:2;
        }
        .dots {
            display:flex;
            gap:8px;
        }
        .dot {
            width:8px;
            height:8px;
            border-radius:50%;
            background:rgba(255,255,255,0.32);
            transition:0.22s;
            cursor:pointer;
        }
        .dot.active {
            background:#fff;
            transform:scale(1.2);
        }
    </style>
</head>
<body>
    <!-- 第一屏：今日壁纸 -->
    <section id="today">
        <img class="bg-img" id="todayImg" src="" alt="Bing今日壁纸">
        <div class="mask"></div>
        <div class="info-wrap">
            <h2 class="title" id="todayTitle">加载中...</h2>
            <p class="desc" id="todayDesc"></p>
            <div class="meta" id="todayMeta"></div>
            <a class="btn" id="downloadBtn">下载原图</a>
        </div>
    </section>

    <!-- 第二屏：历史轮播 -->
    <section id="history">
        <img class="bg-img" id="carouselImg" src="" alt="历史壁纸">
        <div class="mask"></div>
        <div class="info-wrap">
            <h2 class="title" id="carouselTitle">加载中...</h2>
            <p class="desc" id="carouselDesc"></p>
            <div class="meta" id="carouselMeta"></div>
        </div>
        <div class="carousel-wrap">
            <div class="dots" id="dotsBox"></div>
        </div>
    </section>

<script>
(function() {
    const todayImg = document.getElementById('todayImg');
    const todayTitle = document.getElementById('todayTitle');
    const todayDesc = document.getElementById('todayDesc');
    const todayMeta = document.getElementById('todayMeta');
    const downloadBtn = document.getElementById('downloadBtn');

    const carouselImg = document.getElementById('carouselImg');
    const carouselTitle = document.getElementById('carouselTitle');
    const carouselDesc = document.getElementById('carouselDesc');
    const carouselMeta = document.getElementById('carouselMeta');
    const dotsBox = document.getElementById('dotsBox');

    let bingList = [];
    let carouselIndex = 0;

    // 获取必应壁纸API（本地打开也能请求，CORS偶尔浏览器会拦截，遇到就直接打开html用Chrome）
    async function loadToday() {
        try {
            const res = await fetch('https://cn.bing.com/HPImageArchive.aspx?format=js&idx=0&n=8&mkt=zh-CN');
            const json = await res.json();
            bingList = json.images;
            const item = bingList[0];
            const urlBase = 'https://cn.bing.com' + item.url;
            todayImg.src = urlBase;
            todayTitle.innerText = item.title;
            todayDesc.innerText = item.copyright;
            todayMeta.innerText = item.startdate;
            downloadBtn.href = urlBase;
            loadCarousel();
        } catch (e) {
            console.error('加载失败', e);
            todayTitle.innerText = '网络加载失败';
            todayDesc.innerText = '请检查网络';
        }
    }

    function loadCarousel() {
        dotsBox.innerHTML = '';
        bingList.forEach((_, idx) => {
            const dot = document.createElement('span');
            dot.className = 'dot' + (idx === carouselIndex ? ' active' : '');
            dot.onclick = ()=>switchSlide(idx);
            dotsBox.appendChild(dot);
        });
        switchSlide(carouselIndex);
    }

    function switchSlide(idx) {
        carouselIndex = idx;
        const item = bingList[idx];
        const urlBase = 'https://cn.bing.com' + item.url;
        carouselImg.src = urlBase;
        carouselTitle.innerText = item.title;
        carouselDesc.innerText = item.copyright;
        carouselMeta.innerText = item.startdate;
        // 更新指示器
        document.querySelectorAll('.dot').forEach((d,i)=>{
            d.classList.toggle('active', i===idx);
        })
    }

    // 滚轮整屏切换
    let scrolling = false;
    window.addEventListener('wheel', (e)=>{
        if(scrolling) return;
        scrolling = true;
        if(e.deltaY > 30) {
            window.scrollTo({top: window.innerHeight, behavior:'smooth'});
        }else if(e.deltaY < -30){
            window.scrollTo({top:0, behavior:'smooth'});
        }
        setTimeout(()=> scrolling=false, 800);
    }, { passive: true });

    // ===== 启动 =====
    loadToday();
    console.log('✨ 苹果极简风，本地测试就绪');
})();
</script>
</body>
</html>
