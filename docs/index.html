<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bing 每日壁纸</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; }

        #bg {
            position: fixed; inset: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 0.8s ease;
            z-index: -2;
        }
        #overlay {
            position: fixed; inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 100%);
            z-index: -1;
        }

        .top-bar {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 16px 24px;
            display: flex; justify-content: space-between; align-items: center;
            color: #fff;
            font-size: 14px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .top-bar .brand { font-weight: 600; letter-spacing: 0.5px; }
        .top-bar .actions a {
            color: #fff; text-decoration: none;
            margin-left: 16px;
            padding: 6px 12px;
            border-radius: 6px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            transition: background 0.2s;
        }
        .top-bar .actions a:hover { background: rgba(255,255,255,0.28); }

        .info-card {
            position: fixed; left: 0; right: 0; bottom: 0;
            padding: 32px 40px 40px;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
            max-width: 820px;
        }
        .info-card .date {
            font-size: 13px; letter-spacing: 1.5px;
            opacity: 0.85; margin-bottom: 8px;
            text-transform: uppercase;
        }
        .info-card h1 {
            font-size: 32px; font-weight: 700;
            margin-bottom: 6px; line-height: 1.25;
        }
        .info-card h2 {
            font-size: 17px; font-weight: 400;
            opacity: 0.9; margin-bottom: 14px;
        }
        .info-card .desc {
            font-size: 15px; line-height: 1.75;
            opacity: 0.92; max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.3s;
        }
        .info-card .desc.expanded {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .info-card .toggle {
            display: inline-block; margin-top: 12px;
            font-size: 13px; cursor: pointer;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.25);
            transition: background 0.2s;
            user-select: none;
        }
        .info-card .toggle:hover { background: rgba(255,255,255,0.32); }

        .thumb-bar {
            position: fixed; right: 24px; top: 50%;
            transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 8px;
            max-height: 80vh; overflow-y: auto;
            padding: 4px;
        }
        .thumb {
            width: 84px; height: 52px;
            border-radius: 6px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            opacity: 0.5;
            border: 2px solid transparent;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .thumb:hover { opacity: 0.85; }
        .thumb.active { opacity: 1; border-color: #fff; }

        .loading {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 18px;
            background: #111;
            z-index: 10;
            transition: opacity 0.5s;
        }
        .loading.hidden { opacity: 0; pointer-events: none; }

        @media (max-width: 700px) {
            .info-card { padding: 24px 20px 30px; }
            .info-card h1 { font-size: 22px; }
            .info-card h2 { font-size: 14px; }
            .info-card .desc { font-size: 13px; }
            .thumb-bar { display: none; }
        }
    </style>
</head>
<body>
    <div id="bg"></div>
    <div id="overlay"></div>

    <div class="top-bar">
        <div class="brand">🖼️ Bing 每日壁纸</div>
        <div class="actions">
            <a href="json/today.json" target="_blank">今日 JSON</a>
            <a href="json/bing_wallpaper.json" target="_blank">历史 JSON</a>
        </div>
    </div>

    <div class="info-card">
        <div class="date" id="date">加载中...</div>
        <h1 id="subtitle">—</h1>
        <h2 id="title">—</h2>
        <div class="desc" id="desc"></div>
        <div class="toggle" id="toggle">📖 展开百科描述</div>
    </div>

    <div class="thumb-bar" id="thumbBar"></div>

    <div class="loading" id="loading">加载中...</div>

<script>
const $ = id => document.getElementById(id);

async function loadAll() {
    try {
        const res = await fetch('json/bing_wallpaper.json?t=' + Date.now());
        const list = await res.json();
        if (!Array.isArray(list) || !list.length) throw new Error('无数据');

        // 按日期倒序
        list.sort((a, b) => b.date.localeCompare(a.date));

        // 渲染缩略图
        const thumbBar = $('thumbBar');
        thumbBar.innerHTML = '';
        list.forEach((item, i) => {
            const t = document.createElement('div');
            t.className = 'thumb' + (i === 0 ? ' active' : '');
            t.style.backgroundImage = `url(${item.bing_url})`;
            t.title = item.date + ' · ' + (item.subtitle || '');
            t.onclick = () => {
                document.querySelectorAll('.thumb').forEach(el => el.classList.remove('active'));
                t.classList.add('active');
                show(item);
            };
            thumbBar.appendChild(t);
        });

        show(list[0]);
        $('loading').classList.add('hidden');
    } catch (e) {
        $('loading').textContent = '❌ 加载失败: ' + e.message;
    }
}

function show(item) {
    $('bg').style.backgroundImage = `url(${item.bing_url})`;
    $('date').textContent = item.date;
    $('subtitle').textContent = item.subtitle || item.title || '';
    $('title').textContent = (item.title || '').replace(/\s*-\s*\d{4}\/\d{2}\/\d{2}$/, '');
    $('desc').textContent = item.description || '（暂无百科描述）';
    $('desc').classList.remove('expanded');
    $('toggle').textContent = '📖 展开百科描述';
}

$('toggle').onclick = () => {
    const d = $('desc');
    d.classList.toggle('expanded');
    $('toggle').textContent = d.classList.contains('expanded') ? '📕 收起描述' : '📖 展开百科描述';
};

// 键盘左右切换
let currentIndex = 0;
let allList = [];
document.addEventListener('keydown', e => {
    if (!allList.length) return;
    if (e.key === 'ArrowRight') {
        currentIndex = Math.min(currentIndex + 1, allList.length - 1);
        show(allList[currentIndex]);
    } else if (e.key === 'ArrowLeft') {
        currentIndex = Math.max(currentIndex - 1, 0);
        show(allList[currentIndex]);
    }
});

// 首次加载
loadAll().then(() => {
    fetch('json/bing_wallpaper.json?t=' + Date.now())
        .then(r => r.json())
        .then(d => { allList = d.sort((a,b)=>b.date.localeCompare(a.date)); });
});
</script>
</body>
</html>
