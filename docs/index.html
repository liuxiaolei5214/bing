<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bing 每日壁纸 · 光影回顾</title>
    <meta name="description" content="每日更新的必应超清壁纸，4K 高清下载 · 光影回顾" />
    <link rel="icon" href="/favicon.avif">
    <style>
        /* ===== 基础重置 & 隐藏滚动条 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            scrollbar-width: none;
            -ms-overflow-style: none;
            background: #0e1218;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        .viewport {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .viewport::-webkit-scrollbar {
            display: none;
        }

        .fullscreen-section {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 0;
        }

        /* ===== 顶部悬浮胶囊毛玻璃导航 ===== */
        .top-nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            background: rgba(40, 40, 40, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .top-nav .nav-item {
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            transition: all 0.25s ease;
            white-space: nowrap;
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: inherit;
        }

        .top-nav .nav-item:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        .top-nav .nav-item.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.18);
            font-weight: 500;
        }

        /* ===== 今日壁纸区域 ===== */
        #today {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0;
            background: #0e1218;
            position: relative;
        }

        #todayCard {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e232b;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        #todayCard img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 底部渐变遮罩 */
        #todayCard .today-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 55%;
            z-index: 2;
            background: linear-gradient(to top, 
                rgba(0, 0, 0, 0.95) 0%, 
                rgba(0, 0, 0, 0.7) 30%,
                rgba(0, 0, 0, 0.2) 65%,
                transparent 100%
            );
            pointer-events: none;
        }

        /* 内容容器：左下角，高度自适应 */
        #todayCard .today-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 3;
            padding: 40px 48px 36px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* 标题 */
        #todayCard .today-overlay .today-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        /* 描述文字 */
        #todayCard .today-overlay .today-desc {
            font-size: 0.95rem;
            line-height: 1.8;
            opacity: 0.92;
            white-space: normal;
            word-break: break-word;
            color: #f0f0f0;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
            max-height: 40vh;
            overflow-y: auto;
            scrollbar-width: none;
        }

        #todayCard .today-overlay .today-desc::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        #todayCard .today-overlay .today-desc p {
            text-indent: 2em;
            margin: 0;
            padding: 0;
            line-height: 1.8;
        }

        #todayCard .today-overlay .today-desc p + p {
            margin-top: 0;
        }

        /* ===== 按钮组 PC端 / 移动端（统一放在下方） ===== */
        #todayCard .today-overlay .today-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            pointer-events: auto;
            position: relative;
        }

        /* 按钮基础样式 */
        .btn {
            display: inline-flex;
            align-items: center;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 0.8px;
            text-decoration: none;
            color: #f0ede8;
            background: rgba(200, 200, 200, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            transition: all 0.25s;
            white-space: nowrap;
        }

        .btn svg {
            flex-shrink: 0;
            margin-right: 4px;
            width: 14px;
            height: 14px;
        }

        .btn-primary {
            background: rgba(220, 210, 180, 0.15);
            border-color: rgba(240, 230, 200, 0.2);
        }
        .btn-primary:hover {
            background: rgba(220, 210, 180, 0.3);
            transform: scale(1.03);
        }
        .btn-secondary:hover {
            background: rgba(200, 200, 200, 0.15);
            transform: scale(1.02);
        }

        /* ===== 加载状态 ===== */
        .loading {
            color: #888;
            font-size: 1rem;
            text-align: center;
        }

        /* ===== 响应式 · 移动端 ===== */
        @media (max-width: 640px) {
            #todayCard .today-gradient {
                height: 60%; /* 调整渐变高度适应内容增加 */
            }
            #todayCard .today-overlay {
                padding: 20px 20px 24px;
            }
            #todayCard .today-overlay .today-title {
                font-size: 1.2rem;
                margin-bottom: 8px;
            }
            #todayCard .today-overlay .today-desc {
                font-size: 0.82rem;
                line-height: 1.7;
                max-height: 30vh; /* 稍微缩小文字高度，给下方按钮留空间 */
                max-width: 100%;
            }
            
            /* 移动端按钮组适配 */
            #todayCard .today-overlay .today-actions {
                margin-top: 12px;
                gap: 8px;
            }
            #todayCard .today-overlay .today-actions .btn {
                font-size: 0.65rem;
                padding: 5px 12px;
                gap: 4px;
            }
            #todayCard .today-overlay .today-actions .btn svg {
                width: 12px;
                height: 12px;
            }

            /* 顶部深色渐变，保证顶部导航文字清晰 */
            #todayCard::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 140px;
                background: linear-gradient(to bottom, rgba(0, 0, 0, 0.65), transparent);
                z-index: 1;
                pointer-events: none;
            }

            .top-nav {
                top: 12px;
                padding: 4px 8px;
                gap: 2px;
            }
            .top-nav .nav-item {
                padding: 5px 12px;
                font-size: 0.72rem;
            }
        }

        @media (max-width: 480px) {
            #todayCard .today-overlay .today-title {
                font-size: 1.1rem;
            }
            #todayCard .today-overlay .today-desc {
                font-size: 0.75rem;
                line-height: 1.6;
                max-height: 26vh;
            }
            .top-nav .nav-item {
                padding: 4px 10px;
                font-size: 0.68rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 顶部悬浮胶囊毛玻璃导航 ===== -->
    <nav class="top-nav">
        <a href="#" class="nav-item active">首页</a>
        <a href="/carousel.html" class="nav-item">精彩轮播</a>
        <a href="/archive.html" class="nav-item">历史归档</a>
        <a href="/api.html" class="nav-item">API</a>
        <a href="/about.html" class="nav-item">关于</a>
    </nav>

    <!-- ===== 首页壁纸 - 全屏 ===== -->
    <div class="viewport" id="viewport">
        <section id="today" class="fullscreen-section">
            <div id="todayCard">
                <div class="loading">加载中...</div>
            </div>
        </section>
    </div>

    <script>
        (function() {
            "use strict";

            const ICONS = {
                download: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
                book: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
            };

            function isMobileDevice() {
                return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent) || window.innerWidth <= 640;
            }

            function get1080pUrl(url) {
                if (!url) return '';
                let result = url;
                if(isMobileDevice()){
                    result = result.replace(/_UHD\.jpg/g, '_1080x1920.jpg');
                    result = result.replace(/_1920x1080\.jpg/g, '_1080x1920.jpg');
                }else{
                    result = result.replace(/_UHD\.jpg/g, '_1920x1080.jpg');
                    result = result.replace(/_UHD\.jpg\?/g, '_1920x1080.jpg?');
                }
                result = result.replace(/&w=3840&h=2160&rs=1&c=4/g, '');
                return result;
            }

            function get4kUrl(url) {
                if (!url) return '';
                if (url.includes('_UHD.jpg')) {
                    return url;
                }
                if(isMobileDevice()){
                    return url.replace(/_1920x1080\.jpg/g, '_1080x1920.jpg');
                }else{
                    return url.replace(/_1920x1080\.jpg/g, '_UHD.jpg');
                }
            }
            
            function formatTitle(item) {
                const mainTitle = item.subtitle || '';
                const subTitle = item.title || '';
                if (mainTitle && subTitle && mainTitle !== subTitle) {
                    return `${mainTitle} | ${subTitle}`;
                }
                return mainTitle || subTitle || '壁纸';
            }

            function getDetailUrl(title, dateStr) {
                if (!dateStr) return '#';
                let cleanTitle = title.replace(/\s*[-–]\s*\d{4}\/\d{2}\/\d{2}$/, '').trim();
                const parts = dateStr.split('-');
                const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                d.setDate(d.getDate() - 1);
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const dateParam = `${y}${m}${day}_1600`;
                return `https://cn.bing.com/search?q=${encodeURIComponent(cleanTitle)}&form=hpcapt&filters=HpDate:%22${dateParam}%22+mgzv3configlist:%22BingQA_Encyclopedia_Layout%22`;
            }

            function getTodayStr() {
                const now = new Date();
                const y = now.getFullYear();
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const d = String(now.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            let wallpaperDataPromise = null;
        
            function fetchWallpaperData() {
                if (!wallpaperDataPromise) {
                    wallpaperDataPromise = fetch('json/bing_wallpaper.json')
                        .then(resp => {
                            if (!resp.ok) throw new Error('HTTP ' + resp.status);
                            return resp.json();
                        })
                        .catch(err => {
                            wallpaperDataPromise = null;
                            throw err;
                        });
                }
                return wallpaperDataPromise;
            }
            
            async function loadToday() {
                const container = document.getElementById('todayCard');
                try {
                    const data = await fetchWallpaperData();

                    if (!Array.isArray(data) || data.length === 0) {
                        throw new Error('数据为空或格式无效');
                    }

                    const todayStr = getTodayStr();
                    let item = data.find(d => d.date === todayStr);

                    if (!item) {
                        console.warn(`⚠️ 没有 ${todayStr} 的数据，改用最新一条`);
                        const sorted = [...data].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                        item = sorted[0];
                    }

                    if (!item) throw new Error('无可用数据');
                    if (!item.date) item.date = todayStr;

                    const imgUrl = get1080pUrl(item.bing_url || item.url || '');
                    const title = formatTitle(item);
                    const desc = item.description || item.desc || '暂无详细介绍';

                    let descHtml = '';
                    if (desc) {
                        const paragraphs = desc.split('\n')
                            .map(p => p.trim())
                            .filter(p => p !== '');
                        descHtml = paragraphs.map(p => `<p>${p}</p>`).join('');
                    }

                    const detailUrl = getDetailUrl(item.title || item.subtitle || '', item.date);
                    
                    // 统一使用一套按钮组，通过 CSS 适配电脑端和移动端的排版
                    const htmlActions = `
                        <div class="today-actions">
                            <a href="${get4kUrl(item.bing_url || item.url || '')}" class="btn btn-primary" target="_blank">${ICONS.download} UHD/4K</a>
                            <a href="${get1080pUrl(item.bing_url || item.url || '')}" class="btn btn-secondary" target="_blank">${ICONS.download} 1080P</a>
                            <a href="${detailUrl}" class="btn btn-secondary" target="_blank">${ICONS.book} 光影回顾</a>
                        </div>
                    `;

                    container.innerHTML = `
                        <img src="${imgUrl}" alt="${title}" loading="lazy" onerror="this.style.display='none'" />
                        <div class="today-gradient"></div>
                        <div class="today-overlay">
                            <div class="today-title">${title}</div>
                            <div class="today-desc">${descHtml || '暂无详细介绍'}</div>
                            ${htmlActions}
                        </div>
                    `;
                    console.log('✅ 首页壁纸加载成功:', item.date);
                } catch (e) {
                    console.warn('首页壁纸加载失败:', e);
                    container.innerHTML = `<div class="loading">⚠️ 加载失败: ${e.message}</div>`;
                }
            }

            // 启动
            loadToday();
        })();
    </script>
</body>
</html>
